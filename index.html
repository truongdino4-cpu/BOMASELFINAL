    <style>
        body { font-family: 'Inter', sans-serif; }
        
        @media print {
            @page { margin: 10mm; }
            body { 
                background-color: white !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .print-hidden, .no-print { display: none !important; }
            .print-no-shadow { box-shadow: none !important; border-radius: 0 !important; margin: 0 !important; }
            
            textarea, input {
                border: none !important;
                background: transparent !important;
                resize: none !important;
                overflow: hidden !important;
                outline: none !important;
                box-shadow: none !important;
            }
            textarea:empty, input:empty { display: none !important; }
            textarea::placeholder, input::placeholder { color: transparent !important; }
            
            /* Chống cắt đôi dòng khi in */
            tr, td, th, .avoid-break { 
                page-break-inside: avoid !important; 
                break-inside: avoid !important;
            }
            .page-break-before { page-break-before: always !important; }
            
            html, body { height: auto !important; min-height: auto !important; }

</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useRef, useMemo, useEffect, Fragment } = React;

        const Icon = ({ name, className = "w-4 h-4" }) => {
            const icons = {
                'x': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
                'image': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>,
                'plus': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
                'printer': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>,
                'download': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
                'upload': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
                'trash-2': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
                'info': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            };
            return icons[name] || null;
        };

        const EditableInput = ({ value, onChange, placeholder = "", className = "", isTextArea = false, isEditing = true }) => {
            if (isTextArea) {
                return (
                    <Fragment>
                        <textarea
                            value={value || ''}
                            onChange={e => onChange(e.target.value)}
                            placeholder={placeholder}
                            className={`w-full bg-transparent border-none focus:ring-1 focus:ring-blue-500 resize-none outline-none overflow-hidden ${className} ${!isEditing ? 'hidden' : 'block'}`}
                            rows={1}
                            onInput={(e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                        />
                        <div className={`whitespace-pre-wrap ${className} ${!isEditing ? 'block' : 'hidden'}`}>
                            {value}
                        </div>
                    </Fragment>
                );
            }
            return (
                <Fragment>
                    <input
                        type="text"
                        value={value || ''}
                        onChange={e => onChange(e.target.value)}
                        placeholder={placeholder}
                        className={`w-full bg-transparent border-none focus:ring-1 focus:ring-blue-500 outline-none ${className} ${!isEditing ? 'hidden' : 'block'}`}
                    />
                    <div className={`${className} ${!isEditing ? 'block' : 'hidden'}`}>
                        {value}
                    </div>
                </Fragment>
            );
        };

        const ImageUpload = ({ value, onChange, isEditing = true, sku = null }) => {
            const fileInputRef = useRef(null);
            const [imgError, setImgError] = useState(false);

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => { onChange(reader.result); setImgError(false); };
                    reader.readAsDataURL(file);
                }
            };

            // Xác định xem có nên hiển thị khung "Tải ảnh" hay không
            const showUploadPlaceholder = !value && (!sku || imgError);

            return (
                <div className="flex flex-col items-center justify-center w-full h-full min-h-[60px]">
                    {/* Hiển thị ảnh nếu có value (người dùng tự up) */}
                    {value ? (
                        <div className={`relative group w-full h-full flex items-center justify-center`}>
                            <img src={value} alt="Uploaded" className="max-w-full max-h-[80px] object-contain" />
                            <button onClick={() => onChange('')} className={`absolute top-0 right-0 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity print-hidden no-print ${isEditing ? 'block' : 'hidden'}`} title="Xóa ảnh">
                                <Icon name="x" className="w-3 h-3" />
                            </button>
                        </div>
                    ) : (sku && !imgError) ? (
                        /* Nếu không có up tay, tự động tìm ảnh GitHub bằng SKU */
                        <div className={`w-full h-full flex items-center justify-center`}>
                            <img src={`images/${sku}.png`} onError={() => setImgError(true)} alt={sku} className="max-w-full max-h-[80px] object-contain" />
                        </div>
                    ) : null}

                    {/* Khung tải ảnh hiển thị khi chỉnh sửa và không có ảnh nào */}
                    <div onClick={() => fileInputRef.current?.click()} className={`cursor-pointer flex flex-col items-center justify-center text-gray-400 hover:text-blue-500 print-hidden no-print border border-dashed border-gray-300 rounded p-1 w-full h-full ${showUploadPlaceholder && isEditing ? 'flex' : 'hidden'}`}>
                        <Icon name="image" className="w-4 h-4" />
                        <span className="text-[10px] mt-1 text-center">Tải ảnh</span>
                    </div>

                    <div className={`w-full h-full min-h-[60px] ${(showUploadPlaceholder && !isEditing) ? 'block' : 'hidden'}`}></div>
                    <input type="file" accept="image/*" ref={fileInputRef} onChange={handleFileChange} className="hidden" />
                </div>
            );
        };

                    { id: 't7', category: 'VII', categoryName: 'Tủ điện', name: 'Tủ điện', desc: 'Tủ điện 2 lớp cánh, sơn tĩnh điện dày 1.5mm', brand: 'VIỆT NAM', unit: 'Bộ', price: 500, quantities: { tret: 2, t1: 0, t2: 0 } },
                    
                    { id: 'cp1', category: 'VIII', categoryName: 'CP - Chi phí triển khai', name: 'Thiết kế lập trình (12%)', desc: '', brand: '', unit: 'Gói', price: 0, quantities: { tret: 1, t1: 0, t2: 0 }, isImplementationCost: true, type: 'design' },
                    { id: 'cp2', category: 'VIII', categoryName: 'CP - Chi phí triển khai', name: 'Thi công lắp đặt (13%)', desc: '', brand: '', unit: 'Gói', price: 0, quantities: { tret: 1, t1: 0, t2: 0 }, isImplementationCost: true, type: 'install' }
                ]
            });

            const [audioData, setAudioData] = useState([
                { id: 1, name: 'Thiết bị âm ly, nguồn nhạc', desc: 'Thiết bị nguồn phát nhạc 4 vùng độc lập tích hợp điện thông minh:\n- 01 Bộ âm ly 4 vùng độc lập kết nối nguồn nhạc, đã bao gồm phần mềm kết nối điện thông minh.\nTích hợp Airplay, truy xuất kho nhạc online, lấy nhạc từ ổ cứng NAS.\n\nGồm 4 vùng độc lập:\n- Zone 1: Phòng khách\n- Zone 2: Phòng ăn\n- Zone 3: Phòng truyền thống\n- Zone 4: Phòng tắm Master', image: '', unit: 'Bộ', qty: 1, price: 7500 },
                { id: 2, name: 'Thiết bị loa (5.5 cặp gắn trần)', desc: '5.5 cặp loa gắn trần dòng Reference 2-Way từ Origin Acoustic\n- Frequency Response: 60 Hz to 20 kHz (±3 dB)\n- Frequency Range: 41 Hz to 20 kHz (+-10 dB)\n- Sensitivity 87 dB @ 1W/1m\n- 100 Watts, Peak 200W\n- 8 Ohms nominal impedance', image: '', unit: 'Cặp', qty: 5.5, price: 4400 },
                { id: 3, name: 'Chi phí thi công cài đặt, cân chỉnh hệ thống âm thanh', desc: '', image: '', unit: 'Gói', qty: 1, price: 810 },
            ]);

            const [commercialTerms, setCommercialTerms] = useState([
                { label: 'Điều kiện kỹ thuật', value: '100% Mới chưa qua sử dụng.' },
                { label: 'Thời gian giao hàng', value: 'Từ 4-6 tuần kể từ khi ngày kí hợp đồng.' },
                { label: 'Phương thức thanh toán', value: '50% Giá trị hợp đồng ngay sau khi ký hợp đồng.\n40% Giá trị hợp đồng sau khi bàn giao thiết bị trước khi lắp đặt.\n10% Giá trị còn lại sau khi nghiệm thu công trình.' },
                { label: 'Hiệu lực báo giá', value: 'Trong thời hạn 30 ngày kể từ ngày báo giá.' },
                { label: 'Phạm vi cung cấp', value: 'Tủ điện và thiết bị điều khiển trong tủ: các bộ điều khiển chiếu sáng, rèm, điều hòa, bộ xử lý, nguồn...\nPhím bấm thông minh, màn hình cảm ứng\nCác thiết bị cảm biến: chuyển động, cầu thang\nÂm ly và loa' },
                { label: 'Không bao gồm', value: 'Thiết bị đầu cuối (thiết bị được điều khiển): Đèn, điều hòa, rèm động cơ, động cơ cổng, bơm, quạt hút\nCông tắc và ổ cắm điện thường (chủ đầu tư chọn sau)\nCamera (bên ME cấp). Smart home tích hợp miễn phí tất cả các hãng camera IP\nChi phí vật tư và nhân công thi công, ống, dây (dây điện, dây điều khiển, dây loa)' }
            ]);

            // Set isDirty on any state change after initial load
            useEffect(() => {
                if (!initialLoad) setIsDirty(true);
                else setInitialLoad(false);
            }, [bomMap, headerInfo, audioData, commercialTerms, exchangeRate, currency, includeAudio]);

            const hardwareTotal = useMemo(() => {
                return bomMap.items.reduce((sum, item) => {
                    if (item.isImplementationCost) return sum;
                    const totalQty = bomMap.floors.reduce((qSum, f) => qSum + (parseFloat(item.quantities[f.id]) || 0), 0);
                    return sum + (totalQty * (parseFloat(item.price) || 0));
                }, 0);
            }, [bomMap]);

            const implementationCosts = useMemo(() => {
                return { design: hardwareTotal * 0.12, install: hardwareTotal * 0.13 };
            }, [hardwareTotal]);

            const ioCalculations = useMemo(() => {
                const calc = { floors: {}, total: { input: 0, dinNeed: 0, dinReported: 0, missing: 0 } };
                bomMap.floors.forEach(f => { calc.floors[f.id] = { input: 0, dinReported: 0, dinNeed: 0, missing: 0 }; });

                bomMap.items.forEach(item => {
                    const isInputDevice = item.isInput || item.id.includes('v1');
                    const isMechanical = item.isMechanical;
                    const buttons = item.buttons || 1;
                    const isDinController = item.isDinController;

                    bomMap.floors.forEach(f => {
                        const qty = parseFloat(item.quantities[f.id]) || 0;
                        if (isInputDevice) {
                            calc.floors[f.id].input += qty;
                            calc.total.input += qty;
                        } else if (isMechanical) {
                            const inputs = qty * buttons;
                            calc.floors[f.id].input += inputs;
                            calc.total.input += inputs;
                        }

                        if (isDinController) {
                            calc.floors[f.id].dinReported += qty;
                            calc.total.dinReported += qty;
                        }
                    });
                });

                bomMap.floors.forEach(f => {
                    calc.floors[f.id].dinNeed = Math.ceil(calc.floors[f.id].input / 8);
                    const diff = calc.floors[f.id].dinReported - calc.floors[f.id].dinNeed;
                    calc.floors[f.id].missing = diff < 0 ? Math.abs(diff) : 0;
                });

                calc.total.dinNeed = Math.ceil(calc.total.input / 8);
                const totalDiff = calc.total.dinReported - calc.total.dinNeed;
                calc.total.missing = totalDiff < 0 ? Math.abs(totalDiff) : 0;

                return calc;
            }, [bomMap]);

            const detailedData = useMemo(() => {
                let floorsData = [];
                bomMap.floors.forEach(f => {
                    let systemsMap = {};
                    bomMap.items.forEach(item => {
                        const qty = parseFloat(item.quantities[f.id]) || 0;
                        if (qty > 0 && !item.isMechanical && !item.isImplementationCost) {
                            const isCommonSystem = ['IV', 'V', 'VI', 'VII'].includes(item.category);
                            if (!isCommonSystem) {
                                const sysName = `${item.categoryName}`;
                                if (!systemsMap[sysName]) systemsMap[sysName] = { id: sysName, name: sysName, items: [] };
                                systemsMap[sysName].items.push({ ...item, qty, total: qty * item.price });
                            }
                        }
                    });
                    if (Object.keys(systemsMap).length > 0) {
                        floorsData.push({ id: f.id, name: f.name, systems: Object.values(systemsMap) });
                    }
                });

                let commonSystemsMap = {};
                bomMap.items.forEach(item => {
                    const isCommonSystem = ['IV', 'V', 'VI', 'VII'].includes(item.category);
                    if (isCommonSystem && !item.isMechanical && !item.isImplementationCost) {
                        const totalQty = bomMap.floors.reduce((sum, f) => sum + (parseFloat(item.quantities[f.id]) || 0), 0);
                        if (totalQty > 0) {
                            const sysName = `${item.categoryName}`;
                            if (!commonSystemsMap[sysName]) commonSystemsMap[sysName] = { id: sysName, name: sysName, items: [] };
                            commonSystemsMap[sysName].items.push({ ...item, qty: totalQty, total: totalQty * item.price });
                        }
                    }
                });
                if (Object.keys(commonSystemsMap).length > 0) {
                    floorsData.push({ id: 'common', name: 'HỆ THỐNG CHUNG', systems: Object.values(commonSystemsMap) });
                }
                return floorsData;
            }, [bomMap]);

            const showNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(''), 3000);
            };

            const handleExportData = () => {
                const dataToSave = { headerInfo, bomMap, audioData, commercialTerms, includeAudio, exchangeRate, currency };
                const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `BaoGia_${headerInfo.owner.replace(/\s+/g, '_')}_${getTodayDate().replace(/\//g, '')}.json`;
                a.click();
                URL.revokeObjectURL(url);
                setIsDirty(false); // Lưu xong thì xóa cờ báo bẩn
                showNotification("Đã lưu file dự án thành công!");
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.headerInfo) {
                            // Ghi đè ngày cập nhật thành ngày hôm nay
                            setHeaderInfo({...parsed.headerInfo, date: getTodayDate()});
                        }
                        if (parsed.bomMap) setBomMap(parsed.bomMap);
                        if (parsed.audioData) setAudioData(parsed.audioData);
                        if (parsed.commercialTerms) setCommercialTerms(parsed.commercialTerms);
                        if (parsed.includeAudio !== undefined) setIncludeAudio(parsed.includeAudio);
                        if (parsed.exchangeRate) setExchangeRate(parsed.exchangeRate);
                        if (parsed.currency) setCurrency(parsed.currency);
                        setIsDirty(false);
                        showNotification("Mở file dự án thành công!");
                    } catch (err) {
                        showNotification("Lỗi: File không hợp lệ hoặc sai định dạng!");
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; 
            };

            const updateBOMQuantity = (floorId, itemId, newQtyStr) => {
                const qty = parseFloat(newQtyStr);
                const finalQty = isNaN(qty) ? '' : qty;
                setBomMap(prev => {
                    const newItems = prev.items.map(item => {
                        if (item.id === itemId) return { ...item, quantities: { ...item.quantities, [floorId]: finalQty } };
                        return item;
                    });
                    return { ...prev, items: newItems };
                });
            };

            const addFloor = () => {
                const newId = `t${bomMap.floors.length + 1}`;
                setBomMap(prev => {
                    let newFloors = [...prev.floors];
                    newFloors.push({ id: newId, name: `Tầng ${prev.floors.length + 1}` });
                    return { ...prev, floors: newFloors };
                });
            };

            const removeFloor = (floorId) => {
                setBomMap(prev => ({ ...prev, floors: prev.floors.filter(f => f.id !== floorId) }));
            };

            const deleteItemFromDetail = (floorId, itemId) => {
                updateBOMQuantity(floorId, itemId, 0); 
            };

            const deleteItemFromBOM = (itemId) => {
                setBomMap(prev => ({ ...prev, items: prev.items.filter(item => item.id !== itemId) }));
            };

            const addNewItemToBOM = (categoryKey, categoryName) => {
                const newItemId = `sp_${Date.now()}`;
                const newItem = {
                    id: newItemId,
                    category: categoryKey,
                    categoryName: categoryName,
                    name: 'Tên thiết bị mới',
                    desc: '', brand: '', unit: 'Chiếc', price: 0, quantities: {}
                };
                bomMap.floors.forEach(f => newItem.quantities[f.id] = '');
                
                // Chèn vào cuối danh sách của hạng mục đó
                setBomMap(prev => {
                    let newItems = [...prev.items];
                    let insertIndex = newItems.map(i => i.category).lastIndexOf(categoryKey);
                    if (insertIndex !== -1) {
                        newItems.splice(insertIndex + 1, 0, newItem);
                    } else {
                        newItems.push(newItem);
                    }
                    return { ...prev, items: newItems };
                });
                showNotification(`Đã thêm thiết bị vào Hạng mục ${categoryName}`);
            };

            const renderBOM = () => {
                const groupedItems = bomMap.items.reduce((acc, item) => {
                    if (!acc[item.category]) acc[item.category] = { categoryName: item.categoryName, items: [] };
                    acc[item.category].items.push(item);
                    return acc;
                }, {});

                return (
                    <div className="w-full">
                        <h2 className="text-lg font-bold text-center mb-4 uppercase">BẢNG THỐNG KÊ KHỐI LƯỢNG THIẾT BỊ (BOM)</h2>
                        <div className="overflow-x-auto">
                            <table className="w-full border-collapse border border-black min-w-[800px] text-[12px]">
                                <thead>
                                    <tr className="bg-[#d5e8d4] font-bold">
                                        <td className="border border-black p-1 text-center w-8">STT</td>
                                        <td className="border border-black p-1 min-w-[200px]">Hạng mục</td>
                                        <td className="border border-black p-1 text-center w-12">Đơn vị</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-1 text-center w-16 group relative">
                                                <EditableInput value={f.name} onChange={(v) => {
                                                    setBomMap({...bomMap, floors: bomMap.floors.map(fl => fl.id === f.id ? {...fl, name: v} : fl)});
                                                }} className="text-center font-bold" isEditing={!isPreview} />
                                                <button onClick={() => removeFloor(f.id)} className={`absolute -top-2 -right-2 text-red-500 opacity-0 group-hover:opacity-100 bg-white rounded-full border shadow print-hidden ${isPreview ? 'hidden' : 'block'}`}>
                                                    <Icon name="x" className="w-4 h-4" />
                                                </button>
                                            </td>
                                        ))}
                                        <td className="border border-black p-1 text-center w-10">Tổng</td>
                                        <td className="border border-black p-1 text-center w-20">Đơn giá</td>
                                        <td className="border border-black p-1 text-center w-24">Thành tiền</td>
                                    </tr>
                                </thead>
                                <tbody>
                                    {Object.keys(groupedItems).map((catKey) => (
                                        <Fragment key={catKey}>
                                            <tr className="bg-[#e2efda] font-bold avoid-break">
                                                <td className="border border-black p-1 text-center">{catKey}</td>
                                                <td className="border border-black p-1 uppercase" colSpan={bomMap.floors.length + 5}>{groupedItems[catKey].categoryName}</td>
                                            </tr>
                                            {groupedItems[catKey].items.map((item, idx) => {
                                                const totalQty = bomMap.floors.reduce((sum, f) => sum + (parseFloat(item.quantities[f.id]) || 0), 0);
                                                
                                                let displayPrice = item.price;
                                                let displayTotal = totalQty * item.price;
                                                if (item.isImplementationCost) {
                                                   displayPrice = item.type === 'design' ? implementationCosts.design : implementationCosts.install;
                                                   displayTotal = displayPrice; 
                                                }

                                                return (
                                                    <tr key={item.id} className={`avoid-break ${item.isMechanical ? "text-gray-600 bg-gray-50" : "bg-white"}`}>
                                                        <td className="border border-black p-1 text-center font-bold w-8">{idx + 1}</td>
                                                        <td className="border border-black p-1">
                                                            <div className="font-bold flex justify-between items-center group/item">
                                                                <EditableInput value={item.name} onChange={(v) => {
                                                                    setBomMap({...bomMap, items: bomMap.items.map(i => i.id === item.id ? {...i, name: v} : i)});
                                                                }} isEditing={!isPreview} className="flex-1" />
                                                                {!item.isImplementationCost && (
                                                                    <button onClick={() => deleteItemFromBOM(item.id)} className={`text-red-500 opacity-0 group-hover/item:opacity-100 transition-opacity ml-2 print-hidden no-print ${isPreview ? 'hidden' : 'block'}`} title="Xóa thiết bị này">
                                                                        <Icon name="trash-2" className="w-3 h-3" />
                                                                    </button>
                                                                )}
                                                            </div>
                                                            <div className="flex items-center text-[10px] text-gray-400 mt-0.5">
                                                                Mã SP: <EditableInput value={item.id} onChange={(v) => {
                                                                    // Update SKU ID carefully
                                                                    setBomMap({...bomMap, items: bomMap.items.map(i => i.id === item.id ? {...i, id: v} : i)});
                                                                }} isEditing={!isPreview} className="ml-1 w-20" />
                                                            </div>
                                                            {item.isMechanical && <span className="text-[10px] text-red-500 italic block">(Chỉ tính IO)</span>}
                                                        </td>
                                                        <td className="border border-black p-1 text-center">
                                                            <EditableInput value={item.unit} onChange={(v) => {
                                                                setBomMap({...bomMap, items: bomMap.items.map(i => i.id === item.id ? {...i, unit: v} : i)});
                                                            }} isEditing={!isPreview} className="text-center" />
                                                        </td>
                                                        
                                                        {item.isImplementationCost ? (
                                                            <td colSpan={bomMap.floors.length + 1} className="border border-black p-1 text-center text-gray-400 bg-gray-50">- (Tự động) -</td>
                                                        ) : (
                                                            <Fragment>
                                                                {bomMap.floors.map(f => (
                                                                    <td key={f.id} className="border border-black p-1 text-center">
                                                                        <input type="number" value={item.quantities[f.id] === 0 ? '' : (item.quantities[f.id] || '')} onChange={(e) => updateBOMQuantity(f.id, item.id, e.target.value)} className={`w-full text-center border-none focus:ring-1 focus:ring-blue-500 bg-transparent outline-none ${isPreview ? 'hidden' : 'block'}`} />
                                                                        <div className={`text-center w-full ${isPreview ? 'block' : 'hidden'}`}>{item.quantities[f.id] || ''}</div>
                                                                    </td>
                                                                ))}
                                                                <td className="border border-black p-1 text-center font-bold bg-gray-50">{totalQty > 0 ? totalQty : ''}</td>
                                                            </Fragment>
                                                        )}
                                                        <td className="border border-black p-1 text-center">
                                                            {item.isImplementationCost ? '-' : (
                                                                <Fragment>
                                                                    <input type="number" value={item.price} onChange={(e) => { setBomMap({...bomMap, items: bomMap.items.map(i => i.id === item.id ? {...i, price: e.target.value} : i)}); }} className={`w-full text-center bg-transparent border-none focus:ring-1 focus:ring-blue-500 outline-none ${isPreview ? 'hidden' : 'block'}`} />
                                                                    <div className={`text-center w-full ${isPreview ? 'block' : 'hidden'}`}>{formatMoney(item.price)}</div>
                                                                </Fragment>
                                                            )}
                                                        </td>
                                                        <td className="border border-black p-1 text-right">{formatMoney(displayTotal)}</td>
                                                    </tr>
                                                );
                                            })}
                                            {/* Nút thêm thiết bị mới cho nhóm này */}
                                            {catKey !== 'VIII' && (
                                                <tr className={`print-hidden no-print bg-white ${isPreview ? 'hidden' : ''}`}>
                                                    <td colSpan={bomMap.floors.length + 6} className="border border-black p-1 text-center">
                                                        <button onClick={() => addNewItemToBOM(catKey, groupedItems[catKey].categoryName)} className="text-[11px] text-blue-600 font-bold flex items-center justify-center w-full hover:bg-blue-50 py-1 rounded transition-colors">
                                                            <Icon name="plus" className="w-3 h-3 mr-1" /> Thêm thiết bị mới
                                                        </button>
                                                    </td>
                                                </tr>
                                            )}
                                        </Fragment>
                                    ))}

                                    <tr className="bg-[#e2efda] font-bold mt-2 avoid-break">
                                        <td className="border border-black p-1 text-center">IX</td>
                                        <td className="border border-black p-1 uppercase" colSpan={bomMap.floors.length + 5}>TÍNH TOÁN ĐẦU VÀO IO</td>
                                    </tr>
                                    <tr className="avoid-break bg-white">
                                        <td className="border border-black p-1 text-center">1</td>
                                        <td className="border border-black p-1">Tổng số đầu vào Input</td>
                                        <td className="border border-black p-1 text-center">-</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-1 text-center font-bold bg-orange-50">{ioCalculations.floors[f.id].input || ''}</td>
                                        ))}
                                        <td className="border border-black p-1 text-center font-bold bg-orange-50">{ioCalculations.total.input || ''}</td>
                                        <td className="border border-black p-1 text-center" colSpan={2}>-</td>
                                    </tr>
                                    <tr className="avoid-break bg-white">
                                        <td className="border border-black p-1 text-center">2</td>
                                        <td className="border border-black p-1">Số bộ DIN8s-8i CẦN (Làm tròn lên)</td>
                                        <td className="border border-black p-1 text-center">Bộ</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-1 text-center">{ioCalculations.floors[f.id].dinNeed || ''}</td>
                                        ))}
                                        <td className="border border-black p-1 text-center font-bold">{ioCalculations.total.dinNeed || ''}</td>
                                        <td className="border border-black p-1 text-center" colSpan={2}>-</td>
                                    </tr>
                                    <tr className="avoid-break bg-white">
                                        <td className="border border-black p-1 text-center">3</td>
                                        <td className="border border-black p-1">Tổng số bộ Din ĐÃ BÁO</td>
                                        <td className="border border-black p-1 text-center">Bộ</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-1 text-center bg-blue-100">{ioCalculations.floors[f.id].dinReported || ''}</td>
                                        ))}
                                        <td className="border border-black p-1 text-center font-bold bg-blue-100">{ioCalculations.total.dinReported || ''}</td>
                                        <td className="border border-black p-1 text-center" colSpan={2}>-</td>
                                    </tr>
                                    <tr className="avoid-break bg-white">
                                        <td className="border border-black p-1 text-center">4</td>
                                        <td className="border border-black p-1 font-bold text-red-600">Số lượng CẦN BỔ SUNG</td>
                                        <td className="border border-black p-1 text-center">Bộ</td>
                                        {bomMap.floors.map(f => {
                                            const m = ioCalculations.floors[f.id].missing;

                        </div>
                        <div className="flex items-center gap-4">
                            <div className={`text-[12px] font-bold ${isDirty ? 'text-yellow-400' : 'text-green-400'}`}>
                                {isDirty ? "⚠️ Chưa lưu" : "✔️ Đã lưu"}
                            </div>
                            <label className="flex items-center gap-2 cursor-pointer bg-gray-800 px-3 py-1.5 rounded text-sm hover:bg-gray-700 transition-colors">
                                <input type="checkbox" checked={includeAudio} onChange={(e) => setIncludeAudio(e.target.checked)} className="form-checkbox text-blue-500 rounded" />
                                <span>+ Âm thanh</span>
                            </label>
                            <div className="flex items-center gap-2 bg-gray-800 px-3 py-1.5 rounded text-sm">
                                <select value={currency} onChange={e => setCurrency(e.target.value)} className="bg-transparent border-none text-white focus:ring-0 cursor-pointer outline-none font-bold">
                                    <option value="USD">USD</option>
                                    <option value="VND">VNĐ</option>
                                </select>
                                <input type="number" value={exchangeRate} onChange={e => setExchangeRate(Number(e.target.value))} className={`w-20 bg-gray-700 text-white px-2 py-1 rounded text-center border-none focus:ring-1 focus:ring-blue-500 outline-none ${currency === 'VND' ? 'block' : 'hidden'}`} placeholder="Tỷ giá" />
                            </div>
                            <div className="h-6 w-px bg-gray-600 mx-1"></div>
                            <button onClick={handleExportData} className="flex items-center px-4 py-1.5 bg-green-600 hover:bg-green-700 rounded text-sm font-bold shadow transition-colors">
                                <Icon name="download" className="w-4 h-4 mr-2" /> Lưu File
                            </button>
                            <label className="flex items-center px-4 py-1.5 bg-orange-600 hover:bg-orange-700 rounded text-sm font-bold shadow cursor-pointer transition-colors">
                                <Icon name="upload" className="w-4 h-4 mr-2" /> Mở File
                                <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                            </label>
                            <button onClick={() => setIsPreview(true)} className="flex items-center px-5 py-1.5 bg-white text-gray-900 hover:bg-gray-200 rounded font-bold text-sm shadow transition-colors ml-2">
                                <Icon name="printer" className="w-4 h-4 mr-2" /> Xem In PDF
                            </button>
                        </div>
                    </div>

                    {/* Vùng hiển thị giấy A4 */}
                    <div className={`${isPreview ? 'mt-20' : ''} print-no-shadow print-container transition-all duration-300 ${!isPreview ? 'max-w-6xl mx-auto shadow-xl bg-white p-8 rounded-b-md' : (printLayout === 'portrait' ? 'a4-preview-portrait' : 'a4-preview-landscape')}`}>
                        
                        <div className={activeTab === 'bom' ? 'hidden' : 'block'}>
                            <div className="flex justify-between items-start mb-4 border-b pb-4 avoid-break">
                                <div className="w-48 h-16">
                                    <ImageUpload value={headerInfo.logo} onChange={(v) => setHeaderInfo({...headerInfo, logo: v})} isEditing={!isPreview} />
                                </div>
                                <div className="text-right text-[12px] leading-tight text-gray-700">
                                    <div className="font-bold text-blue-900 text-[14px] mb-1 uppercase">ASEL VIỆT NAM</div>
                                    <div className="font-bold">BMS & SMART HOME CENTER</div>
                                    <div>VPGD: Villa số 3, P. Thành Công, Q. Ba Đình, TP. Hà Nội</div>
                                    <div>HCM: 81 Nguyễn Cơ Thạch, An Khánh, TP. Hồ Chí Minh</div>
                                    <div>Website: asel.vn</div>
                                </div>
                            </div>
                            
                            <div className="flex justify-between text-[12px] mb-4 avoid-break leading-tight">
                                <div className="w-1/2 pr-2">
                                    <div className="flex mb-1"><strong className="w-24">Dự án:</strong> <EditableInput value={headerInfo.projectName} onChange={(v) => setHeaderInfo({...headerInfo, projectName: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Chủ đầu tư:</strong> <EditableInput value={headerInfo.owner} onChange={(v) => setHeaderInfo({...headerInfo, owner: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Địa chỉ:</strong> <EditableInput value={headerInfo.location} onChange={(v) => setHeaderInfo({...headerInfo, location: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Phương án:</strong> <EditableInput value={headerInfo.plan} onChange={(v) => setHeaderInfo({...headerInfo, plan: v})} isEditing={!isPreview} /></div>
                                </div>
                                <div className="w-1/2 pl-2">
                                    <div className="flex mb-1"><strong className="w-24">Tư vấn dự án:</strong> <EditableInput value={headerInfo.consultant} onChange={(v) => setHeaderInfo({...headerInfo, consultant: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Số điện thoại:</strong> <EditableInput value={headerInfo.phone} onChange={(v) => setHeaderInfo({...headerInfo, phone: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Email:</strong> <EditableInput value={headerInfo.email} onChange={(v) => setHeaderInfo({...headerInfo, email: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Ngày báo giá:</strong> <EditableInput value={headerInfo.date} onChange={(v) => setHeaderInfo({...headerInfo, date: v})} isEditing={!isPreview} /></div>
                                </div>
                            </div>

                            <div className="mb-4 avoid-break text-left">
                                <div className="font-bold text-[13px] text-blue-800 text-left">
                                    <EditableInput value={headerInfo.introText} onChange={(v) => setHeaderInfo({...headerInfo, introText: v})} isEditing={!isPreview} className="text-left" />
                                </div>
                            </div>
                        </div>

                        <div className={activeTab === 'bom' ? 'block' : 'hidden'}>{renderBOM()}</div>
                        <div className={activeTab === 'detailed' ? 'block' : 'hidden'}>{renderDetailedTable()}</div>
                        <div className={activeTab === 'summary' ? 'block' : 'hidden'}>{renderSummaryTable()}</div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
