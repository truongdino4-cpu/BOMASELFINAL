    <style>
        body { font-family: 'Inter', sans-serif; }
        
        @media print {
            @page { margin: 10mm; }
            body { 
                background-color: white !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .print-hidden, .no-print { display: none !important; }
            .print-no-shadow { box-shadow: none !important; border-radius: 0 !important; margin: 0 !important; }
            
            textarea, input {
                border: none !important;
                background: transparent !important;
                resize: none !important;
                overflow: hidden !important;
                outline: none !important;
                box-shadow: none !important;
            }
            textarea:empty, input:empty { display: none !important; }
            textarea::placeholder, input::placeholder { color: transparent !important; }
            
            /* Chống cắt đôi dòng khi in */
            tr, td, th, .avoid-break { 
                page-break-inside: avoid !important; 
                break-inside: avoid !important;
                page-break-after: auto;
            }
            .page-break-before { page-break-before: always !important; }
            
            html, body { height: auto !important; min-height: auto !important; }
            .print-container { min-height: 0 !important; height: auto !important; padding: 0 !important; background-color: white !important;}
        }

        /* Giao diện khung A4 xem trước */
        .a4-preview-portrait { width: 210mm; min-height: 297mm; margin: 0 auto; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.5); padding: 10mm; }
        .a4-preview-landscape { width: 297mm; min-height: 210mm; margin: 0 auto; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.5); padding: 10mm; }

</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useRef, useMemo, useEffect, Fragment } = React;

        const Icon = ({ name, className = "w-4 h-4" }) => {
            const icons = {
                'x': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
                'image': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>,
                'plus': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
                'printer': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2-2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>,
                'download': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
                'upload': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
                'trash-2': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
                'info': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>,
                'file-spreadsheet': <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            };
            return icons[name] || null;
        };

        const EditableInput = ({ value, onChange, placeholder = "", className = "", isTextArea = false, isEditing = true }) => {
            if (isTextArea) {
                return (
                    <Fragment>
                        <textarea
                            value={value || ''}
                            onChange={e => onChange(e.target.value)}
                            placeholder={placeholder}
                            className={`w-full bg-transparent border-none focus:ring-1 focus:ring-blue-500 resize-none outline-none overflow-hidden ${className} ${!isEditing ? 'hidden' : 'block'}`}
                            rows={1}
                            onInput={(e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                        />
                        <div className={`whitespace-pre-wrap ${className} ${!isEditing ? 'block' : 'hidden'}`}>
                            {value}
                        </div>
                    </Fragment>
                );
            }
            return (
                <Fragment>
                    <input
                        type="text"
                        value={value || ''}
                        onChange={e => onChange(e.target.value)}
                        placeholder={placeholder}
                        className={`w-full bg-transparent border-none focus:ring-1 focus:ring-blue-500 outline-none ${className} ${!isEditing ? 'hidden' : 'block'}`}
                    />
                    <div className={`${className} ${!isEditing ? 'block' : 'hidden'}`}>
                        {value}
                    </div>
                </Fragment>
            );
        };

        const ImageUpload = ({ value, onChange, isEditing = true, sku = null }) => {
            const fileInputRef = useRef(null);
            const [imgError, setImgError] = useState(false);

            useEffect(() => {
                setImgError(false);
            }, [sku]);

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => { onChange(reader.result); setImgError(false); };
                    reader.readAsDataURL(file);
                }
            };

            const showUploadPlaceholder = !value && (!sku || imgError);

            return (
                <div className="flex flex-col items-center justify-center w-full h-full min-h-[60px]">
                    {value ? (
                        <div className={`relative group w-full h-full flex items-center justify-center`}>
                            <img src={value} alt="Uploaded" className="max-w-full max-h-[80px] object-contain" />
                            <button onClick={() => onChange('')} className={`absolute top-0 right-0 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity print-hidden no-print ${isEditing ? 'block' : 'hidden'}`} title="Xóa ảnh">
                                <Icon name="x" className="w-3 h-3" />
                            </button>
                        </div>
                    ) : (sku && !imgError) ? (
                        <div className={`w-full h-full flex items-center justify-center relative group`}>
                            <img src={`images/${sku}.png`} onError={() => setImgError(true)} alt={sku} className="max-w-full max-h-[80px] object-contain" />
                            <button onClick={() => setImgError(true)} className={`absolute top-0 right-0 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity print-hidden no-print ${isEditing ? 'block' : 'hidden'}`} title="Bỏ ảnh tự động">
                                <Icon name="x" className="w-3 h-3" />
                            </button>
                        </div>
                    ) : null}

                    <div onClick={() => fileInputRef.current?.click()} className={`cursor-pointer flex flex-col items-center justify-center text-gray-400 hover:text-blue-500 print-hidden no-print border border-dashed border-gray-300 rounded p-1 w-full h-full ${showUploadPlaceholder && isEditing ? 'flex' : 'hidden'}`}>
                        <Icon name="image" className="w-4 h-4" />
                        <span className="text-[10px] mt-1 text-center">Tải ảnh</span>
                    </div>

                    <div className={`w-full h-full min-h-[60px] ${(showUploadPlaceholder && !isEditing) ? 'block' : 'hidden'}`}></div>
                    <input type="file" accept="image/*" ref={fileInputRef} onChange={handleFileChange} className="hidden" />
                </div>
            );
        };

                        e.preventDefault();
                        e.returnValue = ''; 
                    }

                                    <div>Website: asel.vn</div>
                                </div>
                            </div>
                            
                            <div className="flex justify-between text-[12px] mb-4 avoid-break leading-tight">
                                <div className="w-1/2 pr-2">
                                    <div className="flex mb-1"><strong className="w-24">Dự án:</strong> <EditableInput value={headerInfo.projectName} onChange={(v) => setHeaderInfo({...headerInfo, projectName: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Chủ đầu tư:</strong> <EditableInput value={headerInfo.owner} onChange={(v) => setHeaderInfo({...headerInfo, owner: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Địa chỉ:</strong> <EditableInput value={headerInfo.location} onChange={(v) => setHeaderInfo({...headerInfo, location: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Phương án:</strong> <EditableInput value={headerInfo.plan} onChange={(v) => setHeaderInfo({...headerInfo, plan: v})} isEditing={!isPreview} /></div>
                                </div>
                                <div className="w-1/2 pl-2">
                                    <div className="flex mb-1"><strong className="w-24">Tư vấn dự án:</strong> <EditableInput value={headerInfo.consultant} onChange={(v) => setHeaderInfo({...headerInfo, consultant: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Số điện thoại:</strong> <EditableInput value={headerInfo.phone} onChange={(v) => setHeaderInfo({...headerInfo, phone: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Email:</strong> <EditableInput value={headerInfo.email} onChange={(v) => setHeaderInfo({...headerInfo, email: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Ngày báo giá:</strong> <EditableInput value={headerInfo.date} onChange={(v) => setHeaderInfo({...headerInfo, date: v})} isEditing={!isPreview} /></div>
                                </div>
                            </div>

                            <div className="mb-4 avoid-break text-left">
                                <div className="font-bold text-[13px] text-blue-800 text-left">
                                    <EditableInput value={headerInfo.introText} onChange={(v) => setHeaderInfo({...headerInfo, introText: v})} isEditing={!isPreview} className="text-left" />
                                </div>
                            </div>
                        </div>

                        <div className={activeTab === 'bom' ? 'block' : 'hidden'}>{renderBOM()}</div>
                        <div className={activeTab === 'detailed' ? 'block' : 'hidden'}>{renderDetailedTable()}</div>
                        <div className={activeTab === 'summary' ? 'block' : 'hidden'}>{renderSummaryTable()}</div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
